# cargo-deny config (T-103, ADR-004): defense in depth behind
# scripts/workspace-lints.sh. The script catches direct HTTP client deps;
# these bans catch them arriving transitively. `wrappers` permits a banned
# crate only underneath the two egress-allowed crates.

# FNDR is macOS-only (PRD locked decision). Checking only Apple desktop
# targets keeps the graph honest: it prunes Linux gtk/webkit and the
# iOS/Android-gated reqwest inside tauri, none of which can compile here,
# while the bans stay meaningful for code that actually runs.
[graph]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[bans]
multiple-versions = "warn"
deny = [
    { crate = "reqwest", wrappers = ["fndr-downloader", "fndr-updater"] },
    { crate = "ureq", wrappers = ["fndr-downloader", "fndr-updater"] },
    { crate = "curl", wrappers = ["fndr-downloader", "fndr-updater"] },
    { crate = "isahc", wrappers = ["fndr-downloader", "fndr-updater"] },
    { crate = "attohttpc", wrappers = ["fndr-downloader", "fndr-updater"] },
    { crate = "surf", wrappers = ["fndr-downloader", "fndr-updater"] },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[advisories]
yanked = "deny"
# Unmaintained (not vulnerable) proc-macro and unicode-table crates inside the
# pinned specta/tauri stack; nothing we can swap without leaving the stack.
# Re-check at each scheduled binding-generator upgrade PR (ADR-001).
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste, via specta rc.25" },
    { id = "RUSTSEC-2025-0075", reason = "unic-* family, via urlpattern in tauri-utils" },
    { id = "RUSTSEC-2025-0080", reason = "unic-* family, via urlpattern in tauri-utils" },
    { id = "RUSTSEC-2025-0081", reason = "unic-* family, via urlpattern in tauri-utils" },
    { id = "RUSTSEC-2025-0098", reason = "unic-* family, via urlpattern in tauri-utils" },
    { id = "RUSTSEC-2025-0100", reason = "unic-* family, via urlpattern in tauri-utils" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
