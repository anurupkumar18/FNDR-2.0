[package]
name = "fndr-retrieval"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fndr-inference = { path = "../fndr-inference" }
fndr-store = { path = "../fndr-store" }
arrow-array = "58"
futures = "0.3"
# Kept in lockstep with fndr-store: the vector route reads the derivative that
# LanceWriter owns, never a second index format.
lancedb = "=0.37.1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
