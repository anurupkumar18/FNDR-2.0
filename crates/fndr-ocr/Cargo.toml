[package]
name = "fndr-ocr"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# objc2 pinned to the 0.5 line the ported v1 wrapper was written against
# (0.6 renames msg_send_id and Retained APIs). Upgrading objc2 is its own
# maintenance PR, done together with the T-305 wrapper cleanup.
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSString", "NSData", "NSDictionary", "NSArray"] }
regex = "1"
thiserror = "2"
tracing = "0.1"
