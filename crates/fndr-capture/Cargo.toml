[package]
name = "fndr-capture"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# T-309: the capture gate policy table composes the safety rules directly
# rather than restating them, so a gate cannot drift open by duplication.
# `fndr-privacy` is a leaf crate (url parsing only, no I/O, no HTTP client).
fndr-privacy = { path = "../fndr-privacy" }
image = { version = "0.23", default-features = false }
img_hash = "3.2"
objc2-app-kit = { version = "0.3", features = ["NSRunningApplication", "NSWorkspace"] }
thiserror = "2"
tracing = "0.1"
# T-302/T-310: exact pin per ADR-001 action item 4. This crate is a
# single-maintainer bet whose issue history is leaks and stalled callbacks
# in the *persistent SCStream* path; we deliberately use only the one-shot
# SCScreenshotManager surface, which ADR-001 prefers for our 0.5 FPS model.
# Named fallbacks if it goes bad: objc2-screen-capture-kit, or vendoring.
# It depends on apple-cf/apple-metal, not objc2, so it does not collide
# with fndr-ocr's pinned objc2 0.5 line.
# `macos_14_0` gates the SCScreenshotManager module; macOS 14 is where that
# API landed, and it is the floor this provider requires.
screencapturekit = { version = "=9.0.1", features = ["macos_14_0"] }
# T-309 replay fixtures are checked-in JSON so a gate change is reviewed
# against a stable, synthetic corpus. Parsing only; this crate performs no
# file or network I/O of its own.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
