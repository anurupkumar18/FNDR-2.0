[package]
name = "fndr-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fndr-inference = { path = "../fndr-inference" }
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"
# Exact pin per ADR-002 amendment: fast release cadence, no 1.0.
lancedb = "=0.37.1"
arrow-array = "58"
arrow-schema = "58"
futures = "0.3"

[dev-dependencies]
fndr-types = { path = "../fndr-types" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
